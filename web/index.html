<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitIt - Shared Expense Management</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="brand-mark">S</div>
      <span class="nav-brand-title">SplitIt</span>
    </a>
    <div class="nav-controls">
      <button id="themeToggleBtn" class="theme-toggle-btn">Light Mode</button>
    </div>
  </nav>

  <main class="main-layout" style="display: flex; align-items: center; justify-content: center;">
    <div class="auth-container">
      <div class="card" style="text-align: center;">
        <div class="brand-mark" style="width: 44px; height: 44px; font-size: 1.4rem; margin: 0 auto 16px;">S</div>
        <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-title); margin-bottom: 6px;">SplitIt</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 24px;">
          Track group expenses and settle balances seamlessly
        </p>

        <div style="display: flex; flex-direction: column; gap: 12px;">
          <a href="login.html" class="btn btn-primary">Sign In to Account</a>
          <a href="register.html" class="btn btn-secondary" style="width: 100%;">Create New Account</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
