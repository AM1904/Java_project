<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SplitIt</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="brand-mark">S</div>
      <span class="nav-brand-title">SplitIt</span>
    </a>
    <div class="nav-controls">
      <button id="themeToggleBtn" class="theme-toggle-btn">Light Mode</button>
    </div>
  </nav>

  <main class="main-layout" style="display: flex; align-items: center; justify-content: center;">
    <div class="auth-container">
      <div class="card">
        <div style="text-align: center; margin-bottom: 20px;">
          <h1 style="font-size: 1.4rem; font-weight: 700; color: var(--text-title);">Welcome Back</h1>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Sign in to your SplitIt account</p>
        </div>

        <div id="alertBanner" class="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Enter your username" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Enter your password" required />
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 6px;">Sign In</button>
        </form>

        <div style="text-align: center; margin-top: 18px; font-size: 0.85rem; color: var(--text-muted);">
          Don't have an account? <a href="register.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 600;">Create one</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
