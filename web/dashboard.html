<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - SplitIt</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="dashboard.html" class="nav-brand">
      <div class="brand-mark">S</div>
      <span class="nav-brand-title">SplitIt</span>
    </a>
    <div class="nav-controls">
      <button id="themeToggleBtn" class="theme-toggle-btn">Light Mode</button>
      
      <!-- Clickable User Profile link pointing to account.html -->
      <a href="account.html" class="user-profile-link">
        <div id="userAvatarInitial" class="avatar-circle">U</div>
        <span id="userNameDisplay" style="font-weight: 600; color: var(--text-title); font-size: 0.88rem;">User</span>
      </a>

      <button id="logoutBtn" class="btn btn-secondary btn-sm" style="color: #ef4444; border-color: rgba(239,68,68,0.3);">
        Logout
      </button>
    </div>
  </nav>

  <main class="main-layout" id="dashboardContent">

    <!-- Header -->
    <div style="margin-bottom: 24px;">
      <h1 style="font-size: 1.6rem; font-weight: 700; color: var(--text-title);">Dashboard</h1>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Track shared expenses and settle balances in Indian Rupees (₹)</p>
    </div>

    <!-- Stats Summary Row (in ₹) -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Total Expenses</div>
        <div class="value" id="statTotalExpenses">₹0.00</div>
      </div>
      <div class="stat-card">
        <div class="label">You Owe</div>
        <div class="value" id="statYouOwe" style="color: #ef4444;">₹0.00</div>
      </div>
      <div class="stat-card">
        <div class="label">You Are Owed</div>
        <div class="value" id="statYouAreOwed" style="color: #22c55e;">₹0.00</div>
      </div>
    </div>

    <!-- 2-Column Main Dashboard Grid -->
    <div class="dashboard-grid">

      <!-- Left Column: Add Expense Form -->
      <div class="card" style="height: fit-content;">
        <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-title); margin-bottom: 16px;">Add New Expense</h3>
        
        <form id="addExpenseForm">
          <div class="form-group">
            <label for="expenseDesc">Description</label>
            <input type="text" id="expenseDesc" class="form-input" placeholder="e.g. Dinner, Rent, Cab" required />
          </div>

          <div class="form-group">
            <label for="expenseAmount">Amount (₹)</label>
            <input type="number" id="expenseAmount" step="0.01" min="0.01" class="form-input" placeholder="0.00" required />
          </div>

          <div class="form-group">
            <label for="expenseSplitWith">Split With</label>
            <select id="expenseSplitWith" class="form-select"></select>
          </div>

          <div class="form-group">
            <label for="expenseCategory">Category</label>
            <select id="expenseCategory" class="form-select">
              <option value="food">Food & Dining</option>
              <option value="travel">Travel & Cab</option>
              <option value="entertainment">Entertainment</option>
              <option value="bills">Bills & Utilities</option>
              <option value="general">General</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 6px;">
            Save Expense
          </button>
        </form>
      </div>

      <!-- Right Column: Recent Expenses Feed -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-title);">Recent Activity</h3>
          <a href="account.html" style="font-size: 0.82rem; color: var(--accent-primary); text-decoration: none; font-weight: 600;">View Analytics →</a>
        </div>

        <div id="expenseList" class="expense-list">
          <!-- Dynamically populated via app.js -->
        </div>
      </div>

    </div>
  </main>

  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
