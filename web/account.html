<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Account - SplitIt</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Chart.js CDN for Expense Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="dashboard.html" class="nav-brand">
      <div class="brand-mark">S</div>
      <span class="nav-brand-title">SplitIt</span>
    </a>
    <div class="nav-controls">
      <button id="themeToggleBtn" class="theme-toggle-btn">Light Mode</button>
      <a href="dashboard.html" class="btn btn-secondary btn-sm">Dashboard</a>
      <button id="logoutBtn" class="btn btn-secondary btn-sm" style="color: #ef4444; border-color: rgba(239,68,68,0.3);">
        Logout
      </button>
    </div>
  </nav>

  <main class="main-layout" id="accountContent">

    <!-- User Header Banner -->
    <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 16px;">
        <div id="accountAvatar" class="avatar-circle" style="width: 48px; height: 48px; font-size: 1.3rem;">U</div>
        <div>
          <h2 id="accountUsername" style="font-size: 1.4rem; font-weight: 700; color: var(--text-title);">User Profile</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 2px;">SplitIt Registered Member</p>
        </div>
      </div>
      <div>
        <span style="font-size: 0.8rem; background: var(--bg-input); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-subtle); color: var(--text-muted);">
          Status: Active Account
        </span>
      </div>
    </div>

    <!-- Summary Cards Row (Formatted in Indian Rupees ₹) -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Total Personal Expenses</div>
        <div class="value" id="accountTotalExpenses">₹0.00</div>
      </div>
      <div class="stat-card">
        <div class="label">You Owe</div>
        <div class="value" id="accountYouOwe" style="color: #ef4444;">₹0.00</div>
      </div>
      <div class="stat-card">
        <div class="label">You Are Owed</div>
        <div class="value" id="accountYouAreOwed" style="color: #22c55e;">₹0.00</div>
      </div>
    </div>

    <!-- Analytics Charts Section -->
    <div class="charts-grid">
      
      <!-- Category Breakdown (Pie / Doughnut Chart) -->
      <div class="chart-card">
        <h4>Expense Breakdown by Category</h4>
        <div style="position: relative; height: 260px; display: flex; align-items: center; justify-content: center;">
          <canvas id="categoryPieChart"></canvas>
        </div>
      </div>

      <!-- Monthly / Period Breakdown (Bar Chart) -->
      <div class="chart-card">
        <h4>Monthly Expense Trend</h4>
        <div style="position: relative; height: 260px; display: flex; align-items: center; justify-content: center;">
          <canvas id="monthlyBarChart"></canvas>
        </div>
      </div>

    </div>

  </main>

  <script src="js/validation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
